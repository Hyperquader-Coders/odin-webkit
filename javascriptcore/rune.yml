    - "../build/sys/usr/include/glib-2.0/gio.h"
    - "../build/sys/usr/include/glib-2.0/gmodule/*"
    - "../build/sys/usr/include/glib-2.0/gmodule.h"
    - "../build/sys/usr/lib/x86_64-linux-gnu/glib-2.0/include/*"
  ignore:
    types:
      - va_list
      - '*autoptr*'
    constants:
      - '_*'
      - '*AVAILABLE*'
      - 'JSC_API'
      - 'JSC_DEPRECATED*'
    functions:
      - '*autoptr*'
      - '*auto_cleanup*'
to:
  language: odin
  package: javascriptcore
  out: javascriptcore.odin
  no_build_tag: true
  detect:
    parameters: declared
    arrays:
        class_add_constructorv: [parameter_types]
        class_add_methodv: [parameter_types]
        value_constructor_callv: [parameters]
        value_function_callv: [parameters]
        value_new_functionv: [parameter_types]
        value_object_invoke_methodv: [parameters]
